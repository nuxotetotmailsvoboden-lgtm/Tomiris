[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tomiris"
version = "0.3.0"
description = "TOMIRIS versioned analytical agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1",
  "mypy>=1.11,<3", "bandit>=1.7,<2", "types-PyYAML>=6.0.12",
  "asgi-lifespan>=2.1,<3", "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/tomiris_common",
  "src/tomiris_core_contracts",
  "src/tomiris_agent_sdk",
  "src/tomiris_agent_runtime",
  "src/tomiris_hub",
  "src/tomiris_notifications",
  "src/tomiris_orchestrator",
  "src/tomiris_market_data",
  "src/tomiris_features",
  "src/tomiris_agent_roles",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
