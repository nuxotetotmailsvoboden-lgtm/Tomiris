name: tomiris-phase-03-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tomiris
          POSTGRES_USER: tomiris
          POSTGRES_PASSWORD: tomiris
        options: >-
          --health-cmd "pg_isready -U tomiris -d tomiris"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://tomiris:tomiris@localhost:5432/tomiris
      TEST_DATABASE_URL: postgresql+asyncpg://tomiris:tomiris@localhost:5432/tomiris
      APP_ENV: test
      TOMIRIS_HUB_INGEST_KEY_ID: current
      TOMIRIS_HUB_INGEST_SECRET: 0123456789abcdef0123456789abcdef
      TOMIRIS_ORCHESTRATOR_AGENT_MASTER_SECRET: command-root-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install '.[dev]'
      - run: python -m alembic upgrade head
      - name: Migration round trip
        run: |
          python -m alembic downgrade 0003_orchestrator
          python -m alembic upgrade head
          python -m alembic check
      - run: python scripts/sync_agent_registry.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: bandit -q -r src
      - name: Phase 01 and Phase 02 regression
        run: >-
          pytest -q tests
          --ignore=tests/unit/test_phase03_features.py
          --ignore=tests/unit/test_phase03_market_data.py
          --ignore=tests/unit/test_phase03_role_framework.py
          --ignore=tests/unit/test_phase03_runtime.py
          --ignore=tests/security/test_phase03_provider_security.py
          --ignore=tests/integration/test_phase03_binance_provider.py
          --ignore=tests/integration/test_phase03_signal_lineage.py
          --ignore=tests/e2e/test_phase03_pilot_e2e.py
      - name: Phase 03 unit tests
        run: pytest -q tests/unit
      - name: Phase 03 security tests
        run: pytest -q tests/security
      - name: Phase 03 PostgreSQL integration tests
        run: pytest -q tests/integration
      - name: Phase 03 PostgreSQL concurrency tests
        run: pytest -q tests/concurrency
      - name: Notification tests
        run: pytest -q tests/notification
      - name: Phase 03 end-to-end tests
        run: pytest -q tests/e2e
