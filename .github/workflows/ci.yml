name: tomiris-phase-04-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tomiris
          POSTGRES_USER: tomiris
          POSTGRES_PASSWORD: tomiris
        options: >-
          --health-cmd "pg_isready -U tomiris -d tomiris"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+asyncpg://tomiris:tomiris@localhost:5432/tomiris
      TEST_DATABASE_URL: postgresql+asyncpg://tomiris:tomiris@localhost:5432/tomiris
      APP_ENV: test
      TOMIRIS_HUB_INGEST_KEY_ID: current
      TOMIRIS_HUB_INGEST_SECRET: 0123456789abcdef0123456789abcdef
      TOMIRIS_ORCHESTRATOR_AGENT_MASTER_SECRET: command-root-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install '.[dev]'
      - run: python -m alembic upgrade head
      - name: Migration round trip
        run: |
          python -m alembic downgrade 0003_orchestrator
          python -m alembic upgrade head
          python -m alembic check
      - run: python scripts/sync_agent_registry.py
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: bandit -q -r src
      - name: Wheel build
        run: python -m pip wheel --no-deps . -w dist
      - name: Phase 01 core regression
        run: >-
          pytest -q
          tests/concurrency/test_nonce_concurrency.py
          tests/integration/test_database_fail_closed.py
          tests/integration/test_restart_replay.py
          tests/integration/test_signal_ingestion.py
          tests/security/test_api_authentication_matrix.py
          tests/security/test_hmac_authentication.py
          tests/unit/test_config.py
          tests/unit/test_request_body.py
          tests/unit/test_schemas.py
          tests/unit/test_security.py
      - name: Phase 02 regression
        run: >-
          pytest -q
          tests/unit/test_phase02_dispatch_client.py
          tests/unit/test_phase02_runtime.py
          tests/security/test_phase02_security.py
          tests/integration/test_phase02_health.py
          tests/integration/test_phase02_orchestration.py
          tests/integration/test_phase02_recovery.py
          tests/integration/test_phase02_signal_lineage.py
          tests/concurrency/test_phase02_dispatch_leases.py
          tests/e2e/test_phase02_e2e.py
      - name: Phase 03 unit tests
        run: pytest -q tests/unit/test_phase03_*.py
      - name: Phase 03 security tests
        run: pytest -q tests/security/test_phase03_provider_security.py
      - name: Phase 03 PostgreSQL integration tests
        run: pytest -q tests/integration/test_phase03_*.py
      - name: Notification tests
        run: pytest -q tests/notification
      - name: Phase 03 end-to-end tests
        run: pytest -q tests/e2e/test_phase03_pilot_e2e.py
      - name: Phase 04 unit tests
        run: pytest -q tests/unit/test_phase04_*.py
      - name: Phase 04 security tests
        run: pytest -q tests/security/test_phase04_*.py
      - name: Phase 04 integration tests
        run: pytest -q tests/integration/test_phase04_*.py
      - name: Phase 04 concurrency tests
        run: pytest -q tests/concurrency/test_phase04_*.py
      - name: Phase 04 end-to-end tests
        run: pytest -q tests/e2e/test_phase04_*.py
